# The one manifest for both halves of maintenance: the Go process in main.go and
# the browser bundle under ui/.

name: maintenance
kind: sink
version: 0.14.0
license: MIT
title: Maintenance
summary: Print-hour schedules per printer, nozzle life by material and tool hours read from your G-code.
codeowner: singlergold2
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

require:
  core: ">=0.1.0-beta.1"
  core-storage.stat: "*"
  core-storage.fetch: "*"

options:
  - key: language
    type: string
    default: "system"
    summary: The language of the module's pages, one of system, en, de or cs. system follows the browser.
  - key: alert_percent
    type: int
    default: "90"
    summary: The share of an interval at which a task reads as due soon, between 1 and 99.

needs:
  database: true

permissions:
  # read the fleet and the print history the hours come from
  - observe
  # read a finished print's G-code from the server's storage
  - read_storage

events:
  maintenance: maintenance.task

ui:
  entry: ui/index.js
  library: ">=0.1.0 <1.0.0"
  contributes:
    pages:
      - path: maintenance
        title: Maintenance
      - path: maintenance-manual
        title: Maintenance manual
        icon: clipboard-list
    device_tab:
      - id: maintenance
        title: Maintenance
    cards:
      - id: maintenance
        title: Maintenance
        description: The tasks of one printer, or of the whole fleet, with how far each interval has run.
        icon: list-checks
        size: {w: 4, h: 3}
        least: {w: 3, h: 2}
        settings:
          - key: device
            kind: text
            label: Printer
            max_bytes: 64
            default: ""
