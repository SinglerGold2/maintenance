# The one manifest for both halves of maintenance: the Go process in main.go and
# the browser bundle under ui/.

name: maintenance
kind: sink
version: 0.10.0
license: MIT
title: Maintenance
summary: Counts print hours per printer and reminds you when maintenance is due.
codeowner: singlergold2
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

require:
  core: ">=0.1.0-beta.1"
  core-storage.stat: "*"
  core-storage.fetch: "*"

options:
  - key: alert_percent
    type: int
    default: "90"
    summary: The share of an interval at which a task reads as due soon, between 1 and 99.

needs:
  database: true

permissions:
  # read the fleet and the print history the hours come from
  - observe

events:
  maintenance: maintenance.task

ui:
  entry: ui/index.js
  library: ">=0.0.1 <1.0.0"
  contributes:
    pages:
      - path: maintenance
        title: Maintenance
    device_tab:
      - id: maintenance
        title: Maintenance
    cards:
      - id: due
        title: Maintenance due
        description: The tasks that are due now or due soon, on every printer.
        icon: list-checks
        size: {w: 4, h: 3}
        least: {w: 3, h: 2}
